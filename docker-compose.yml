version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: userprofile-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userprofile
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: userprofile-backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@database:5432/userprofile
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3001
    container_name: userprofile-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
